apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-collector
  namespace: collectors
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-collector
  template:
    metadata:
      labels:
        app: market-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: market-collector
          image: big-data/market-collector:phase2
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: collector-config}
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: collector-secrets, key: MYSQL_PASSWORD}
          ports:
            - {name: health, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /live, port: health}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: health}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
