apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: data
spec:
  replicas: 1
  version: 4.2.0
  kafka:
    name: kafka
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      KAFKA_BROKER_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-kafka-bootstrap.data.svc.cluster.local:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAIN:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAIN
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
    storage:
      type: persistent-claim
      persistentVolumeClaim:
        size: 20Gi
        storageClassName: local-path
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: all-existing-topics
  namespace: data
spec:
  kafka:
    name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: data
spec:
  type: ClusterIP
  ports:
  - name: plain
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093
  selector:
    app: kafka-kafka
