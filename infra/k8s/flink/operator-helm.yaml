# infra/k8s/flink/operator-helm.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
# Flink K8s Operator CRDs (bundled with operator 1.2.0)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flinkdeployments.flink.apache.org
spec:
  group: flink.apache.org
  names:
    kind: FlinkDeployment
    listKind: FlinkDeploymentList
    plural: flinkdeployments
    singular: flinkdeployment
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flinksessionjobs.flink.apache.org
spec:
  group: flink.apache.org
  names:
    kind: FlinkSessionJob
    listKind: FlinkSessionJobList
    plural: flinksessionjobs
    singular: flinksessionjob
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
# Install via helm template for portability (HelmFile-style for k3s)
# helm template apache/flink-operator \
#   --namespace flink \
#   --values infra/k8s/flink/flink-operator-values.yaml \
#   --set image.repository=apache/flink-kubernetes-operator \
#   --set image.tag=1.2.0 \
#   > infra/k8s/flink/operator-helm.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-operator
  namespace: flink
  labels:
    app: flink-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-operator
  template:
    metadata:
      labels:
        app: flink-operator
    spec:
      serviceAccountName: flink-operator
      containers:
        - name: flink-operator
          image: apache/flink-kubernetes-operator:1.2.0
          imagePullPolicy: IfNotPresent
          command: ["/docker-entrypoint.sh", "operator"]
          ports:
            - containerPort: 8081
              name: rest
          env:
            - name: FLINK_HOME
              value: /opt/flink
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-operator
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flink-operator-cluster-role
rules:
  - apiGroups:
      - flink.apache.org
    resources:
      - flinkdeployments
      - flinkdeployments/status
      - flinkjobs
      - flinkjobs/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flink-operator-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flink-operator-cluster-role
subjects:
  - kind: ServiceAccount
    name: flink-operator
    namespace: flink
