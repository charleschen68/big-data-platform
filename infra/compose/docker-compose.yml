  # --- 3. Flink JobManager ---
  flink-jobmanager:
    user: root
    image: flink:1.18
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    networks:
      - big-data-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../libs/jdk:/opt/jdk
      - ../../data/streampark_workspace:/streampark/workspace
      - ../../flink-1.18.1/lib:/opt/flink/lib
      - ../../flink-data/checkpoints:/opt/flink/checkpoints
      - ../../flink-data/savepoints:/opt/flink/savepoints
      - ../../flink-data/usrlib:/opt/flink/usrlib
      - ../../data/flink_checkpoints:/flink_checkpoints
      - ../../data/flink_uploads:/opt/flink/usr
    environment:
      - JAVA_HOME=/opt/jdk
      - PATH=/opt/jdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - TZ=Asia/Shanghai # <-- 新增：上海时间
      - ENABLE_BUILT_IN_PLUGINS=flink-s3-fs-presto-1.18.1.jar
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-port: 8081
        parallelism.default: 1
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE
        state.backend: hashmap
        state.checkpoints.dir: s3://flink-state/checkpoints
        state.savepoints.dir: s3://flink-state/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        classloader.resolve-order: child-first
        env.java.opts.all: -Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=0
    deploy:
      resources:
        limits:
          memory: 1536M

  # --- 4. Flink TaskManager ---
  flink-taskmanager:
    user: root
    image: flink:1.18
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    networks:
      - big-data-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../libs/jdk:/opt/jdk
      - ../../data/streampark_workspace:/streampark/workspace
      - ../../flink-1.18.1/lib:/opt/flink/lib
      - ../../flink-data/checkpoints:/opt/flink/checkpoints
      - ../../flink-data/savepoints:/opt/flink/savepoints
      - ../../flink-data/usrlib:/opt/flink/usrlib
    environment:
      - JAVA_HOME=/opt/jdk
      - PATH=/opt/jdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - TZ=Asia/Shanghai # <-- 新增：上海时间
      - ENABLE_BUILT_IN_PLUGINS=flink-s3-fs-presto-1.18.1.jar
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
        taskmanager.memory.process.size: 4096m
        taskmanager.host: flink-taskmanager
        taskmanager.bind-host: 0.0.0.0
        classloader.resolve-order: child-first
        env.java.opts.all: -Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=0
        state.checkpoints.dir: s3://flink-state/checkpoints
        state.savepoints.dir: s3://flink-state/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
    deploy:
      resources:
        limits:
          memory: 10240M

