    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    networks:
      - big-data-network
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: Asia/Shanghai # <-- 新增：上海时间
    ports:
      - "9001:9001"
      - "9002:9000"
    volumes:
      - ../../data/minio:/data
    command: server /data --console-address ":9001"

